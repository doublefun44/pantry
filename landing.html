<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#4A7A52"/>
<title>Funtry — Effortless pantry tracking</title>
<meta name="description" content="Tap, don't type. Track what's in your kitchen in minutes — no accounts, no subscriptions, your data stays on your phone."/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#4A7A52;--coral:#C96B3C;--amber:#F5A623;
  --ink:#2C2A27;--ink2:#6B5F55;--ink3:#8A7E74;
  --bg:#FAF6F3;--card:#FFFFFF;--line:#E8D5C4;
  --r:16px;--rsm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:760px;margin:0 auto;padding:0 20px;}
section{padding:56px 0;}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;background:rgba(250,246,243,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:'DM Serif Display',serif;font-size:22px;color:var(--green);}
.lang-toggle{display:flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;}
.lang-btn{padding:4px 13px;font-size:12px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--ink3);font-family:inherit;transition:all .15s;}
.lang-btn.on{background:var(--green);color:#fff;}

/* hero */
.hero{text-align:center;padding-top:48px;}
.hero-logo{width:72px;height:72px;border-radius:18px;margin-bottom:20px;box-shadow:0 6px 20px rgba(74,122,82,.18);}
.hero h1{font-family:'DM Serif Display',serif;font-size:40px;line-height:1.12;margin-bottom:16px;letter-spacing:-.01em;}
.hero p{font-size:17px;color:var(--ink2);max-width:520px;margin:0 auto 28px;}
.cta{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-size:16px;font-weight:600;padding:15px 32px;border-radius:30px;box-shadow:0 6px 18px rgba(74,122,82,.28);transition:transform .15s,box-shadow .15s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(74,122,82,.34);}
.cta-note{display:block;margin-top:12px;font-size:13px;color:var(--ink3);}

/* pain */
.pain{text-align:center;}
.pain h2{font-family:'DM Serif Display',serif;font-size:28px;margin-bottom:14px;}
.pain p{font-size:16px;color:var(--ink2);max-width:560px;margin:0 auto;}
.pain-kicker{font-family:'DM Serif Display',serif;font-size:21px;color:var(--green);margin-top:22px;letter-spacing:-.01em;}

/* features */
.features{display:grid;grid-template-columns:1fr;gap:16px;}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;}
.feat-ico{font-size:30px;margin-bottom:10px;}
.feat h3{font-size:18px;font-weight:600;margin-bottom:6px;}
.feat p{font-size:14px;color:var(--ink2);}

/* media slots */
.sec-title{font-family:'DM Serif Display',serif;font-size:26px;text-align:center;margin-bottom:28px;}
.video-slot{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:14px;text-align:center;padding:20px;}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.shot{background:var(--card);border:2px dashed var(--line);border-radius:var(--r);aspect-ratio:9/19;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13px;text-align:center;padding:10px;}
/* TODO(上线后补素材): 录好演示视频 + 3 张真机截图后，删掉下面这条规则即可让两块重新显示，并替换 {{VIDEO_EMBED}} / {{SCREENSHOT_1..3}} */
.pending-asset{display:none;}

/* install */
.install{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px;}
.install h2{font-family:'DM Serif Display',serif;font-size:24px;text-align:center;margin-bottom:22px;}
.step{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:15px;color:var(--ink2);}
.step:last-child{margin-bottom:0;}
.step-n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;}
.step svg{flex-shrink:0;vertical-align:middle;margin:0 2px;}

/* footer */
footer{border-top:1px solid var(--line);padding:32px 0 40px;text-align:center;}
footer .brand{display:block;margin-bottom:8px;}
footer p{font-size:13px;color:var(--ink3);}

@media (min-width:600px){
  .features{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:420px){
  .hero h1{font-size:32px;}
  .shots{gap:8px;}
  .shot{font-size:11px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <span class="brand">Funtry</span>
    <div class="lang-toggle">
      <button class="lang-btn" id="lb-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="lb-zh" onclick="setLang('zh')">中文</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- HERO -->
  <section class="hero">
    <img class="hero-logo" src="icon-512.png" alt="Funtry"/>
    <h1 data-t="hero_h1"></h1>
    <p data-t="hero_sub"></p>
    <a class="cta" href="{{GUMROAD_URL}}" data-t="cta"></a>
    <span class="cta-note" data-t="cta_note"></span>
  </section>

  <!-- PAIN -->
  <section class="pain">
    <h2 data-t="pain_h"></h2>
    <p data-t="pain_p"></p>
    <p class="pain-kicker" data-t="pain_kick"></p>
  </section>

  <!-- FEATURES -->
  <section>
    <div class="features">
      <div class="feat">
        <div class="feat-ico">🏪</div>
        <h3 data-t="f1_h"></h3>
        <p data-t="f1_p"></p>
      </div>
      <div class="feat">
        <div class="feat-ico">🔔</div>
        <h3 data-t="f2_h"></h3>
        <p data-t="f2_p"></p>
      </div>
      <div class="feat">
        <div class="feat-ico">🔒</div>
        <h3 data-t="f3_h"></h3>
        <p data-t="f3_p"></p>
      </div>
    </div>
  </section>

  <!-- VIDEO — 隐藏中，待补演示视频（见 .pending-asset 注释） -->
  <section class="pending-asset">
    <h2 class="sec-title" data-t="video_h"></h2>
    <div class="video-slot">{{VIDEO_EMBED}}</div>
  </section>

  <!-- SCREENSHOTS — 隐藏中，待补真机截图（见 .pending-asset 注释） -->
  <section class="pending-asset">
    <h2 class="sec-title" data-t="shots_h"></h2>
    <div class="shots">
      <div class="shot">{{SCREENSHOT_1}}</div>
      <div class="shot">{{SCREENSHOT_2}}</div>
      <div class="shot">{{SCREENSHOT_3}}</div>
    </div>
  </section>

  <!-- INSTALL -->
  <section>
    <div class="install">
      <h2 data-t="install_h"></h2>
      <div class="step">
        <span class="step-n">1</span>
        <span>
          <span data-t="install_1a"></span>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4A7A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><rect x="4" y="11" width="16" height="10" rx="2"/></svg>
          <span data-t="install_1b"></span>
        </span>
      </div>
      <div class="step">
        <span class="step-n">2</span>
        <span data-t="install_2"></span>
      </div>
      <div class="step">
        <span class="step-n">3</span>
        <span data-t="install_3"></span>
      </div>
    </div>
  </section>

  <!-- CTA REPEAT -->
  <section style="text-align:center;padding-top:8px;">
    <a class="cta" href="{{GUMROAD_URL}}" data-t="cta"></a>
  </section>

</div>

<footer>
  <span class="brand">Funtry</span>
  <p data-t="footer"></p>
</footer>

<script>
var DICT = {
  en: {
    hero_h1: 'Your pantry, finally under control.',
    hero_sub: "Tap, don't type. Track what's in your kitchen in minutes — no accounts, no subscriptions, your data stays on your phone.",
    cta: 'Get Funtry — Free',
    cta_note: 'Works in your browser · Add to Home Screen for the full app',
    pain_h: "Don't let fresh food perish in the fuss.",
    pain_p: 'Tracking your kitchen should be quick — even fun. Funtry turns logging into a few playful taps, so fresh food gets eaten, not forgotten behind a chore you keep dodging.',
    pain_kick: 'Less fuss. More fun. Nothing wasted.',
    f1_h: 'Supermarket Dash',
    f1_p: 'Restocking plays like a game — tap through your shelves and you\'re done before the bags are unpacked. All the fun, none of the fuss.',
    f2_h: 'Smart expiry alerts',
    f2_p: 'Only nudges you about food that genuinely needs attention, so notifications stay meaningful.',
    f3_h: 'Private by design',
    f3_p: 'No account, no cloud. Everything lives on your device and exports to a file whenever you want.',
    video_h: 'See it in action',
    shots_h: 'A peek inside',
    install_h: 'Install on iPhone',
    install_1a: 'Tap the Share button',
    install_1b: 'at the bottom of Safari',
    install_2: 'Scroll down and choose "Add to Home Screen"',
    install_3: 'Open Funtry from your home screen — it runs full-screen like a real app',
    footer: 'Made with care · Your data stays yours.',
  },
  zh: {
    hero_h1: '你的食材库，终于井井有条。',
    hero_sub: '点一点，不用打字。几分钟就能记好厨房里有什么——无需账号、无需订阅，数据只存在你的手机上。',
    cta: '免费使用趣囤',
    cta_note: '浏览器即可使用 · 添加到主屏幕获得完整 App 体验',
    pain_h: '别让新鲜食材，败给一堆瞎折腾。',
    pain_p: '管理厨房，该是件麻利、甚至有点好玩的事。趣囤把记录变成几下轻快的点击——让新鲜食材被吃掉，而不是遗忘在你一直躲着的琐事背后。',
    pain_kick: '少点折腾，多点乐趣，不浪费一口。',
    f1_h: '逛超市囤货',
    f1_p: '补库存像玩小游戏——在货架间点一点，购物袋还没拆完就记好了。全是乐趣，毫不折腾。',
    f2_h: '智能到期提醒',
    f2_p: '只提醒真正需要关注的食材，让每一条通知都有意义。',
    f3_h: '隐私优先设计',
    f3_p: '无账号、无云端。一切都存在你的设备上，随时可导出成文件。',
    video_h: '看它如何运作',
    shots_h: '抢先一览',
    install_h: '在 iPhone 上安装',
    install_1a: '点击 Safari 底部的',
    install_1b: '分享按钮',
    install_2: '向下滑动，选择「添加到主屏幕」',
    install_3: '从主屏幕打开 Funtry——它会像真正的 App 一样全屏运行',
    footer: '用心打造 · 你的数据始终属于你。',
  }
};

var lang = localStorage.getItem('pantry_lang')
  || ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en');

function applyLang() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh';
  var d = DICT[lang];
  document.querySelectorAll('[data-t]').forEach(function(el) {
    var v = d[el.getAttribute('data-t')];
    if (v !== undefined) el.textContent = v;
  });
  document.getElementById('lb-en').classList.toggle('on', lang === 'en');
  document.getElementById('lb-zh').classList.toggle('on', lang === 'zh');
}

function setLang(l) {
  lang = l;
  localStorage.setItem('pantry_lang', l);
  applyLang();
}

applyLang();
</script>

</body>
</html>
